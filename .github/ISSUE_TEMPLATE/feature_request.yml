name: Feature request
description: Suggest an idea for Deckmate
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem and the solution as concretely as you can — it speeds up triage.

        Check existing [issues](https://github.com/pierkulakov/deckmate/issues) and [discussions](https://github.com/pierkulakov/deckmate/discussions) before requesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve? What works badly or is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Deckmate do? Be as concrete as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how another tool handles it.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to submit a PR for this (see CONTRIBUTING.md)
