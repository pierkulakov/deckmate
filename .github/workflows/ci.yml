name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run typecheck
      - run: npx vitest run --project unit
      - run: npm run build
      - run: npm pack --ignore-scripts --dry-run

  # 2026-11-12: measured durations balance three serial shards without dropping files.
  # Windows Edge covers the desktop WebView2 engine; unit jobs cover filesystem
  # and process behaviour on both systems. Required checks depend on every shard.
  browser:
    name: browser (${{ matrix.os }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [1, 2, 3]
        include:
          - os: windows-latest
            browser: C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe
    # 2026-11-10: runner-images documents both browsers as installed; a missing executable must fail, never skip UI coverage.
    env:
      DECKMATE_BROWSER: ${{ matrix.browser }}
      DECKMATE_REQUIRE_BROWSER: '1'
      SHARD: ${{ matrix.shard }}/3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline
      - run: npx vitest run --project browser --shard="$SHARD"

  # The main ruleset requires the `checks (ubuntu-latest)` and `checks (windows-latest)`
  # contexts, and the release workflow waits for them. Each one passes only when
  # every unit and browser job above passed, so a skipped or cancelled shard fails it.
  checks:
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Both contexts must report; fail-fast would cancel one when the other fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Require every unit and browser job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const failed = Object.entries(JSON.parse(process.env.RESULTS)).filter(([, job]) => job.result !== 'success');
          for (const [name, job] of failed) console.log(`::error::${name} finished with ${job.result}.`);
          process.exitCode = failed.length ? 1 : 0;
          NODE
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t deckmate:ci .

  # The desktop shell is Rust since the Tauri move, so CI compiles it, runs its
  # unit tests and smoke-tests a debug build (2026-11-09). It runs on every push
  # and pull request: GitHub Actions has path filters only per workflow, not per
  # job, and a workflow-level filter would also skip the checks and docker jobs
  # above, which today run unconditionally.
  desktop-shell:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline
      # A debug shell serves dist/server/main.js from this checkout, so the client
      # and server must be built before the self-test (2026-11-09).
      - run: npm run build
      # 2026-11-13: generate_context! embeds the desktop frontend at compile time.
      - run: npm run build:desktop
      - name: Show the pinned Rust toolchain
        # rust-toolchain.toml selects the audited version and components; show it
        # here so a runner provisioning failure is not buried inside cargo.
        working-directory: desktop/src-tauri
        run: |
          rustup show
          cargo --version
          rustc --version
      # The target folder is cached too, so clippy and tests reuse compiled dependencies (2026-11-12).
      - name: Cache Rust dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # Both components are on the runner image; the explicit add keeps the job
      # working if the image ever trims them (2026-11-09).
      - run: rustup component add rustfmt clippy
        working-directory: desktop/src-tauri
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: cargo build --locked
        working-directory: desktop/src-tauri
      - name: Self-test the debug shell
        run: |
          $demo = Join-Path $env:RUNNER_TEMP 'deckmate-shell-demo'
          node bin/deckmate.mjs init $demo
          if ($LASTEXITCODE -ne 0) { throw "deckmate init exited with code $LASTEXITCODE." }
          $exe = 'desktop/src-tauri/target/debug/Deckmate.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing build output: $exe" }
          # A windowed binary never blocks PowerShell's call operator, so wait for
          # the process and read its exit code (2026-11-09).
          $report = Join-Path $env:RUNNER_TEMP 'self-test-debug.json'
          $shell = Start-Process -FilePath $exe -ArgumentList "--self-test $demo" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $report
          $line = Get-Content -LiteralPath $report | Where-Object { $_.TrimStart().StartsWith('{') } | Select-Object -Last 1
          if (-not $line) { throw 'Deckmate.exe --self-test did not print a JSON report.' }
          $result = $line | ConvertFrom-Json
          Get-Content -LiteralPath $report
          if ($shell.ExitCode -ne 0) { throw "Deckmate.exe --self-test exited with code $($shell.ExitCode)." }
          if ($result.ok -ne $true -or -not [string]::IsNullOrEmpty([string]$result.error)) {
            throw "Deckmate.exe --self-test reported failure: $line"
          }
      - name: Smoke-test the real window over CDP
        # Drives the debug shell end to end (launcher, board, bridges, server lifetime) through
        # the page bridges over CDP (2026-11-09). Kept optional: it needs a working WebView2 in
        # the runner's desktop session, and a red smoke must not mask the required checks above.
        # 2026-11-10: d45d635 introduced this as an environment prerequisite, not a known sleep race;
        # provision/verify WebView2 and an interactive session before making the window smoke required.
        continue-on-error: true
        run: npm run desktop:smoke
