name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Validate release version and notes
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The tag must match the version in package.json.');
          }
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find((entry) => entry.startsWith(`[${version}] - `));
          if (!section || !section.includes('\n')) {
            throw new Error(`CHANGELOG.md needs a dated [${version}] release section.`);
          }
          const notes = section.slice(section.indexOf('\n') + 1).trim();
          if (!notes) throw new Error('Release notes must not be empty.');
          writeFileSync('release-notes.md', `${notes}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Validate publication access
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != "false" ]]; then
            echo "::error::Open the repository before publishing a public release."
            exit 1
          fi
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Configure the NPM_TOKEN repository secret before pushing a release tag."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack release
        id: package
        run: |
          npm pack --ignore-scripts --json > package-info.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const [artifact] = JSON.parse(readFileSync('package-info.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${artifact.filename}\n`);
          NODE
      - name: Check published npm artifact
        id: npm
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const [artifact] = JSON.parse(readFileSync('package-info.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(artifact.name)}/${encodeURIComponent(artifact.version)}`, { signal: AbortSignal.timeout(30000) });
          let published = false;
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`npm registry check failed: HTTP ${response.status}.`);
            const existing = await response.json();
            if (!artifact.integrity || existing.dist?.integrity !== artifact.integrity) {
              throw new Error('This npm version already exists with different package bytes. Publish a new version instead.');
            }
            published = true;
            console.log('The identical npm artifact is already published; resuming the remaining release steps.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          NODE
      - name: Build container
        id: container
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deckmate"
          docker build --pull --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.version=${VERSION}" --tag "${image}:${VERSION}" .
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Publish npm package
        if: steps.npm.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm_tag=latest
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; fi
          npm publish "$PACKAGE_FILE" --access public --provenance --tag "$npm_tag"
      - name: Publish container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.container.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
          docker logout ghcr.io
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE_FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" --verify-tag --title "Deckmate ${VERSION}" --notes-file release-notes.md "${prerelease[@]}"
          fi

  # Runs only after npm, GHCR and the GitHub Release are published, so a failed
  # desktop build never blocks or undoes them; the installer can then be uploaded
  # by hand (2026-11-08).
  desktop:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate desktop version
        id: desktop
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path -LiteralPath desktop/package.json)) { throw 'desktop/package.json is missing.' }
          $desktopVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($desktopVersion -ne $version) { throw "desktop/package.json has version $desktopVersion; it must match $version." }
          # The Tauri config may carry its own version; if it does, it must not drift (2026-11-09).
          if (Test-Path -LiteralPath desktop/src-tauri/tauri.conf.json) {
            $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            if ($null -ne $tauriVersion -and $tauriVersion -ne $version) { throw "desktop/src-tauri/tauri.conf.json has version $tauriVersion; it must match $version." }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
      - run: npm ci
      - name: Show Rust toolchain
        # The runner image ships a stable Rust toolchain; showing it fails here,
        # not deep inside the Tauri build, if that ever changes (2026-11-09).
        run: |
          rustup show
          cargo --version
          rustc --version
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the dependency caches: target/ is multi-GB and the release and CI
          # jobs would evict more from the 10 GB repo cache than they save (2026-11-09).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # prepare-sidecar.mjs runs npm pack in the root, which builds dist/, and stages
      # the bundled Node runtime and the deckmate package for the Tauri build (2026-11-09).
      - name: Stage the bundled Node runtime and deckmate package
        run: node desktop/scripts/prepare-sidecar.mjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Self-test the unpacked release build
        run: |
          $release = 'desktop/src-tauri/target/release'
          $demo = Join-Path $env:RUNNER_TEMP 'deckmate-selftest'
          foreach ($file in @("$release/Deckmate.exe", "$release/node.exe", "$release/deckmate/bin/deckmate.mjs")) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing build output: $file" }
          }
          & "$release/node.exe" "$release/deckmate/bin/deckmate.mjs" init $demo
          if ($LASTEXITCODE -ne 0) { throw "deckmate init exited with code $LASTEXITCODE." }
          # A windowed release binary never blocks PowerShell's call operator,
          # so wait for the process and read its exit code (2026-11-09).
          # The JSON line goes to a file: a GUI-subsystem exe has no console to print to (2026-11-09).
          $report = Join-Path $env:RUNNER_TEMP 'self-test-release.json'
          $shell = Start-Process -FilePath "$release/Deckmate.exe" -ArgumentList "--self-test $demo" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $report
          Get-Content -LiteralPath $report
          if ($shell.ExitCode -ne 0) { throw "Deckmate.exe --self-test exited with code $($shell.ExitCode)." }
      - name: Self-test the installer and the uninstaller
        env:
          VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          $release = 'desktop/src-tauri/target/release'
          # Tauri names the installer <productName>_<version>_<arch>-setup.exe; finding it by pattern keeps
          # this step independent of that scheme (2026-11-09).
          $installers = @(Get-ChildItem -LiteralPath "$release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer in $release/bundle/nsis, found $($installers.Count)." }
          $installer = $installers[0].FullName
          # Tauri's NSIS template installs silently with /S, and NSIS itself takes /D=
          # as the unquoted, trailing override of the install dir; runner temp paths
          # never contain spaces, which NSIS requires there (2026-11-09).
          $installDir = Join-Path $env:RUNNER_TEMP 'deckmate-install'
          $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer exited with code $($setup.ExitCode)." }
          $installed = "$installDir/Deckmate.exe"
          if (-not (Test-Path -LiteralPath $installed)) { throw "The installer did not create $installed." }
          $demo = Join-Path $env:RUNNER_TEMP 'deckmate-selftest'
          $report = Join-Path $env:RUNNER_TEMP 'self-test-installed.json'
          $shell = Start-Process -FilePath $installed -ArgumentList "--self-test $demo" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $report
          Get-Content -LiteralPath $report
          if ($shell.ExitCode -ne 0) { throw "The installed Deckmate.exe --self-test exited with code $($shell.ExitCode)." }
          # _?= runs the uninstaller in place, which is the only way -Wait means
          # anything; NSIS then cannot delete uninstall.exe itself, so only the app
          # binary is asserted gone (2026-11-09).
          $uninstall = Start-Process -FilePath "$installDir/uninstall.exe" -ArgumentList "/S _?=$installDir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "The uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $installed) { throw "The uninstaller left $installed behind." }
      - name: Pack release assets and record sizes
        env:
          VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          $release = 'desktop/src-tauri/target/release'
          New-Item -ItemType Directory -Force -Path desktop/release | Out-Null
          # Keep the asset names the Electron releases already used (2026-11-09).
          $installers = @(Get-ChildItem -LiteralPath "$release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer in $release/bundle/nsis, found $($installers.Count)." }
          Move-Item -LiteralPath $installers[0].FullName -Destination "desktop/release/Deckmate Setup $env:VERSION.exe"
          # The portable zip carries exactly the three release outputs, not the Cargo build junk.
          $inputs = @("$release/Deckmate.exe", "$release/node.exe", "$release/deckmate")
          foreach ($file in $inputs) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release output: $file" }
          }
          Compress-Archive -Path $inputs -DestinationPath "desktop/release/Deckmate-$env:VERSION-win-x64.zip"
          $installerMb = [math]::Round((Get-Item -LiteralPath "desktop/release/Deckmate Setup $env:VERSION.exe").Length / 1MB, 1)
          $unpackedMb = [math]::Round((Get-ChildItem -LiteralPath $inputs -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          # Next to the Electron figures, to watch the trend while the Tauri build settles (2026-11-09).
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
            '### Windows desktop sizes',
            '',
            '| Artifact | Tauri | Electron (2026-11-08) |',
            '|---|---|---|',
            "| Installer | $installerMb MB | 121 MB |",
            "| Unpacked | $unpackedMb MB | 380 MB |"
          )
      - name: Upload desktop build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.desktop.outputs.version }}
        run: |
          $installer = "desktop/release/Deckmate Setup $env:VERSION.exe"
          $files = @($installer, "desktop/release/Deckmate-$env:VERSION-win-x64.zip")
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing build output: $file" }
          }
          gh release upload "$env:GITHUB_REF_NAME" @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload exited with code $LASTEXITCODE." }
