<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' ipc: http://ipc.localhost">
  <title>Deckmate</title>
  <script src="theme.js"></script>
  <link rel="preload" href="../../assets/fonts/source-sans-3/SourceSans3-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/source-sans-3/SourceSans3-cyrillic-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../loading-composition.css">
  <link rel="stylesheet" href="startup.css">
  <script src="page-ready.js"></script>
</head>
<body>
  <main id="startup" class="opening-screen" role="status" aria-live="polite" aria-atomic="true" aria-label="Deckmate">
    <div class="opening-composition">
      <header class="opening-brand">
        <svg class="deckmate-mark" width="40" height="40" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <path class="deckmate-mark-back" d="M3 4H4V13H11V14H10V15H3V14H2V5H3Z"/>
          <path class="deckmate-mark-front" d="M6 1H13V2H14V11H13V12H6V11H5V2H6Z"/>
          <path class="deckmate-mark-pip" d="M9 4H10V5H11V6H12V7H11V8H10V9H9V8H8V7H7V6H8V5H9Z"/>
        </svg>
        <h1>Deckmate</h1>
      </header>
      <div class="opening-project">
        <span id="project-tile" class="opening-tile" aria-hidden="true"></span>
        <div class="opening-copy">
          <p id="opening-label" class="opening-label"></p>
          <p id="project-name" class="opening-name" dir="auto"></p>
        </div>
        <span class="opening-activity" aria-hidden="true"></span>
      </div>
      <a id="return-to-start" class="opening-recovery" href="index.html" hidden></a>
    </div>
  </main>
  <script type="module" src="startup.js"></script>
</body>
</html>
