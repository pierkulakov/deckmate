<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Deckmate</title>
  <link rel="stylesheet" href="launcher.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="launcher" id="launcher" aria-busy="true">
    <section class="intro">
      <header class="brand">
        <svg class="mark" width="44" height="44" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
          <path class="mark-back" d="M3 4H4V13H11V14H10V15H3V14H2V5H3Z"/>
          <path class="mark-front" d="M6 1H13V2H14V11H13V12H6V11H5V2H6Z"/>
          <path class="mark-pip" d="M9 4H10V5H11V6H12V7H11V8H10V9H9V8H8V7H7V6H8V5H9Z"/>
        </svg>
        <h1 class="wordmark">Deckmate</h1>
      </header>
      <p class="tagline" data-text="tagline"></p>

      <div class="actions">
        <div class="action">
          <button type="button" class="button button-primary" id="open-folder">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
            <span data-text="openFolder"></span>
            <kbd class="shortcut" aria-hidden="true">Ctrl+O</kbd>
          </button>
          <p class="hint" data-text="openHint"></p>
        </div>
        <div class="action">
          <button type="button" class="button button-secondary" id="create-project">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span data-text="createProject"></span>
          </button>
          <p class="hint" data-text="createHint"></p>
        </div>
      </div>

      <div class="table" aria-hidden="true">
        <div class="shelf">
          <div class="cover" style="--deck-color: #028188; --deck-band: #01797f; --art: url('art/art.webp')"><span class="cover-art"></span><span class="cover-title">Art</span><span class="cover-count">12</span></div>
          <div class="cover" style="--deck-color: #4c7099; --deck-band: #47698f; --art: url('art/buildings.webp')"><span class="cover-art"></span><span class="cover-title">Buildings</span><span class="cover-count">7</span></div>
        </div>
        <div class="fan">
          <div class="fan-card fan-card-doc" style="--i: 2"><img src="art/cards.png" alt=""></div>
          <div class="fan-card fan-card-task" style="--i: 4"><img src="art/cards.png" alt=""></div>
          <div class="fan-card fan-card-hero" style="--i: 0"><img src="art/cards.png" alt=""></div>
        </div>
      </div>
    </section>

    <section class="recent" aria-labelledby="recent-heading">
      <div class="recent-head">
        <h2 id="recent-heading" data-text="recent"></h2>
        <span class="count" id="recent-count" hidden></span>
      </div>
      <ul class="recent-list" id="recent-list" aria-labelledby="recent-heading"></ul>
      <p class="recent-empty" id="recent-empty" data-text="recentEmpty" hidden></p>
    </section>

    <footer class="bar">
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text" data-text="statusIdle"></span>
        <button type="button" class="link" id="status-retry" hidden data-text="retry"></button>
      </div>
      <div class="bar-tools">
        <div class="segment" role="group" aria-label="Language">
          <button type="button" class="segment-item" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="segment-item" data-lang="ru" aria-pressed="false">RU</button>
        </div>
        <button type="button" class="tool" id="theme-toggle" aria-pressed="true">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <span class="version" id="version"></span>
      </div>
    </footer>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
