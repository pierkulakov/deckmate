<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' ipc: http://ipc.localhost">
  <title>Deckmate</title>
  <style>
    /* 2026-11-12: no fonts, images or scripts may delay the first local frame; match the native background. */
    :root { color-scheme: dark; background: #17181b; color: #edeef2; font: 16px/1.4 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(420px, 70vw); }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; }
    svg { flex: none; }
    .skeleton { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .skeleton span { height: 148px; border-radius: 8px; background: #27242f; border: 1px solid #39354a; }
  </style>
</head>
<body>
  <main id="startup" aria-busy="true" aria-label="Deckmate">
    <header>
      <svg width="40" height="40" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="#7a52d6" d="M3 4H4V13H11V14H10V15H3V14H2V5H3Z"/>
        <path fill="#b08af3" d="M6 1H13V2H14V11H13V12H6V11H5V2H6Z"/>
        <path fill="#f5c24c" d="M9 4H10V5H11V6H12V7H11V8H10V9H9V8H8V7H7V6H8V5H9Z"/>
      </svg>
      <h1>Deckmate</h1>
    </header>
    <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
