[package]
name = "deckmate-desktop"
version = "0.5.0"
description = "Deckmate Windows desktop shell"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "deckmate_desktop"

[[bin]]
name = "Deckmate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
regex = "=1.13.1"
chrono = "=0.4.45"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "=0.39.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
