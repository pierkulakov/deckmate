<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Deckmate — your project, on your desktop. People and AI agents, the same Markdown files.</title>
  <!-- 2026-11-11: the banner uses real demo tiles, captured at 4× in social-cards.png so the tilted tiles stay sharp; render with `npm run shots -- --social`. -->
  <style>
    @font-face { font-family: "Source Sans 3"; src: url('../assets/fonts/source-sans-3/SourceSans3-latin-wght.woff2'); font-weight: 200 900; }
    @font-face { font-family: "Geist Mono"; src: url('../assets/fonts/geist/GeistMono-Medium.ttf'); font-weight: 500; }
    /* 2026-11-11: use the board's dark surface, text and card-material palette. */
    :root { color-scheme: dark; --night: #1c1a24; --ground: #27242f; --surface: #39354a; --ink: #edeef2; --muted: #cdc8dc; --plum: #906cbd;
      --gold: #e8bd48; --champagne: #f7e18e; --hero-ink: #24180a; --mint: #a8eedf; --mark: #b08af3; --pip: #f5c24c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--ink); font-family: "Source Sans 3", sans-serif; }
    .stage { position: relative; width: 1280px; height: 640px; overflow: hidden;
      background:
        radial-gradient(440px 360px at 1000px 240px, color-mix(in srgb, var(--gold) 28%, transparent), transparent 72%),
        radial-gradient(760px 620px at 80px -100px, color-mix(in srgb, var(--plum) 65%, transparent), transparent 74%),
        radial-gradient(500px 400px at 1220px 620px, color-mix(in srgb, var(--mint) 12%, transparent), transparent 70%),
        linear-gradient(160deg, var(--surface), var(--night) 60%); }
    /* A faint pixel grid recalls the board and the pixel mark without competing with the cards. */
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 120% at 50% 45%, transparent 55%, #0000008c); }
    .stage::before { content: ""; position: absolute; inset: 0; opacity: .25;
      background-image: radial-gradient(#ffffff26 1.2px, transparent 1.6px); background-size: 32px 32px; }
    .copy { position: absolute; z-index: 2; left: 64px; top: 44px; width: 650px; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .logo { width: 88px; height: 88px; image-rendering: pixelated; filter: drop-shadow(0 6px 18px #906cbd66); }
    h1 { margin: 0; padding-bottom: 8px; font-size: 96px; font-weight: 800; line-height: 1; letter-spacing: -.035em; color: var(--ink); }
    .slogan { margin: 24px 0 0; font-size: 72px; font-weight: 800; line-height: .98; letter-spacing: -.025em;
      color: var(--champagne); }
    .tagline { margin: 26px 0 0; color: var(--muted); font-size: 30px; font-weight: 500; line-height: 1.28; }
    .tagline b { color: var(--ink); font-weight: 700; }
    /* One entry rail gives the desktop a clear lead while the CLI shares the same foundation. */
    .entry { position: absolute; z-index: 3; left: 64px; right: 64px; bottom: 40px; height: 108px; display: grid; grid-template-columns: 1.65fr 1fr;
      overflow: hidden; border: 1px solid #f7e18e99; border-radius: 14px;
      box-shadow: 0 12px 40px #07060c66; }
    .desktop { display: flex; align-items: center; gap: 22px; padding: 18px 28px; color: var(--hero-ink);
       background: linear-gradient(112deg, color-mix(in srgb, var(--gold) 90%, var(--hero-ink)), var(--gold) 22%, var(--champagne) 48%, var(--gold) 76%); }
    .desktop svg { width: 36px; height: 36px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .desktop strong { display: block; font-size: 32px; font-weight: 800; line-height: 1.15; }
    .desktop small { display: block; margin-top: 5px; font-size: 23px; line-height: 1.2; }
    .terminal { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 16px 30px;
      background: var(--ground); border-left: 1px solid #fff4c280; }
    .terminal span { color: var(--muted); font-size: 20px; font-weight: 600; }
    code { color: var(--mint); font: 500 28px/1.3 "Geist Mono", monospace; white-space: nowrap; }
    .cards { position: absolute; left: 625px; top: 0; width: 630px; height: 480px; }
    /* 2026-11-11: three real tiles stand in depth and stay readable: the review Task steps down to the left, the
       accepted Task steps up to the right, so every title and band shows; two more wait out of focus behind them. */
    .card { position: absolute; width: 230px; height: 294px; overflow: hidden; border-radius: 10px; transform: var(--t);
      box-shadow: 0 22px 34px #07060cb3, 0 10px 54px var(--glow, transparent); }
    .card img { position: absolute; top: -16px; left: calc(-16px - 262px * var(--i)); width: 1310px; height: 326px; }
    .card.is-far { filter: blur(2.5px) brightness(.62); box-shadow: none; }
    /* One diagonal band of light crosses the Hero's face, the way foil catches a lamp. */
    .card.is-hero::after { content: ""; position: absolute; inset: 0; mix-blend-mode: screen;
      background: linear-gradient(112deg, transparent 34%, #fff4c214 45%, #ffffff24 50%, #a8eedf14 55%, transparent 66%); }
    .floor { position: absolute; left: 110px; right: 90px; top: 380px; height: 64px; border-radius: 50%; background: radial-gradient(closest-side, #000000b3, transparent); filter: blur(9px); }
    /* A foil orbit tilts around the Hero; the tokens ride on it. Its spectrum is the accepted Hero's. */
    .orbit { position: absolute; left: 940px; top: 245px; width: 620px; height: 620px; margin: -310px 0 0 -310px; border-radius: 50%; opacity: .9;
      transform: rotate(-14deg) scaleY(.371); background: conic-gradient(from 200deg, #f7e18e, #a8eedf, #9fc3ee, #b08af3, #f5a3c7, #f7e18e);
      -webkit-mask: radial-gradient(closest-side, transparent 97.8%, #000 98.6%); mask: radial-gradient(closest-side, transparent 97.8%, #000 98.6%); }
    .orbit.is-wide { width: 800px; height: 800px; margin: -400px 0 0 -400px; opacity: .22; transform: rotate(-14deg) scaleY(.3); }
    /* Golden rays give the Hero a focal point without changing the card face. */
    .rays { position: absolute; left: 940px; top: 225px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; opacity: .3;
      background: repeating-conic-gradient(from 0deg, #f7e18e40 0deg 4deg, transparent 4deg 15deg);
      -webkit-mask: radial-gradient(closest-side, #000 8%, transparent 62%); mask: radial-gradient(closest-side, #000 8%, transparent 62%); }
    /* Tokens wear the metal of the thing they stand for: Hero gold, review amethyst, accepted green, estimate silver, Hand mint. */
    .token { position: absolute; z-index: 4; display: grid; place-items: center; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; color: var(--ink-on);
      background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--metal) 70%, #fff), var(--metal) 58%, color-mix(in srgb, var(--metal) 68%, #000));
      box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--metal) 58%, #000), 0 8px 18px #07060c99, 0 0 28px color-mix(in srgb, var(--metal) 60%, transparent); }
    .token svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .token.is-small { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
    .token.is-small svg { width: 21px; height: 21px; }
    /* Pixel sparkles in the mark's pip shape. */
    .spark { position: absolute; width: 24px; height: 24px; background: var(--c); image-rendering: pixelated;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 8px var(--c)); }
  </style>
</head>
<body>
  <main class="stage">
    <div class="rays"></div>
    <div class="orbit is-wide"></div>
    <div class="orbit"></div>
    <section class="copy">
      <div class="brand">
        <img class="logo" src="../assets/logo/deckmate-256.png" alt="Deckmate logo">
        <h1>Deckmate</h1>
      </div>
      <p class="slogan">You hold<br>all the cards.</p>
      <p class="tagline">A local board for <b>people &amp; AI agents.</b><br>The same <b>Markdown files.</b> Yours.</p>
    </section>
    <div class="cards" aria-label="Real cards from the sample project, standing in depth">
      <div class="floor"></div>
      <div class="card is-far" style="--i: 2; --t: translate(-14px, 8px) rotate(-11deg) scale(.56)"><img src="social-cards.png" alt=""></div>
      <div class="card is-far" style="--i: 1; --t: translate(424px, 206px) rotate(9deg) scale(.58)"><img src="social-cards.png" alt=""></div>
      <div class="card" style="--i: 4; --glow: #a57fe680; --t: translate(22px, 150px) rotate(-6deg) scale(.86)"><img src="social-cards.png" alt="Bake the promised cake, a Task in review"></div>
      <div class="card" style="--i: 3; --glow: #3fae6e80; --t: translate(410px, 30px) rotate(6deg) scale(.86)"><img src="social-cards.png" alt="Tune the blue shell, an accepted Task"></div>
      <div class="card is-hero" style="--i: 0; --glow: #e5b65099; --t: translate(205px, 80px)"><img src="social-cards.png" alt="Light the first bonfire, a Hero with Sub Card progress"></div>
    </div>
    <i class="token" style="--metal: #e5b650; --ink-on: #24180a; left: 1066px; top: 60px" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294zM5 21h14"/></svg></i>
    <i class="token is-small" style="--metal: #a57fe6; --ink-on: #1c1033; left: 639px; top: 320px" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></i>
    <i class="token is-small" style="--metal: #4cc27c; --ink-on: #08240f; left: 1246px; top: 176px" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>
    <i class="token is-small" style="--metal: #cfc9e0; --ink-on: #24202e; left: 884px; top: 418px" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 12V7.5A2.5 2.5 0 0 1 10.5 5h3A2.5 2.5 0 0 1 16 7.5V12"/><path d="M7.1 21A7 7 0 1 1 16.9 21Z" fill="currentColor" stroke="none"/></svg></i>
    <i class="token is-small" style="--metal: #a8eedf; --ink-on: #0c5547; left: 800px; top: 62px" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.56 17L7.26 17.95A1.5 1.5 0 0 1 5.4 16.92L2.92 8.27A1.5 1.5 0 0 1 3.95 6.41L7.32 5.45A1.5 1.5 0 0 1 9.04 6.16"/><path d="M13.94 17L10.5 17A1.5 1.5 0 0 1 9 15.5L9 6.5A1.5 1.5 0 0 1 10.5 5L14 5A1.5 1.5 0 0 1 15.46 6.16"/><path d="M17.18 5.45L20.55 6.41A1.5 1.5 0 0 1 21.58 8.27L19.1 16.92A1.5 1.5 0 0 1 17.24 17.95L13.88 16.98A1.5 1.5 0 0 1 12.85 15.13L15.33 6.48A1.5 1.5 0 0 1 17.18 5.45Z"/></svg></i>
    <section class="entry" aria-label="Start with the Windows app, or use the CLI">
      <div class="desktop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>
        <div><strong>Download for Windows</strong><small>Native app · Tauri 2 · Node.js included</small></div>
      </div>
      <div class="terminal"><span>For agents &amp; terminals</span><code>npx deckmate</code></div>
    </section>
    <i class="spark" style="--c: #f5c24c; left: 1228px; top: 34px"></i>
    <i class="spark" style="--c: #a8eedf; left: 742px; top: 44px; width: 16px; height: 16px"></i>
    <i class="spark" style="--c: #b08af3; left: 652px; top: 424px; width: 18px; height: 18px"></i>
    <i class="spark" style="--c: #f7e18e; left: 1100px; top: 26px; width: 30px; height: 30px"></i>
    <i class="spark" style="--c: #a8eedf; left: 1244px; top: 430px; width: 20px; height: 20px"></i>
    <i class="spark" style="--c: #f5c24c; left: 836px; top: 18px; width: 14px; height: 14px"></i>
  </main>
</body>
</html>
