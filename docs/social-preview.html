<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Deckmate — a local Markdown project board for teams of people and AI agents</title>
  <!-- 2026-11-07: GitHub link preview, 1280×640; rendered by `npm run shots`. The fanned cards are crops of the real
       docs/social-cards.png capture (five cards, 230×294 px each, 262 px apart, 16 px inset), not redrawn UI. -->
  <style>
    @font-face { font-family: "Source Sans 3"; src: url('../assets/fonts/source-sans-3/SourceSans3-latin-wght.woff2'); font-weight: 200 900; }
    @font-face { font-family: "Geist Mono"; src: url('../assets/fonts/geist/GeistMono-Medium.ttf'); font-weight: 500; }
    :root { color-scheme: dark; --night: #15131c; --ink: #f9f9fa; --muted: #cdc8dc; --plum: #9258e5; --gold: #f5c24c;
      --champagne: #f7e18e; --hero: #e5b650; --mint: #a8eedf; --mint-ground: #0f3a35; --mint-edge: #2a8a7b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--ink); font-family: "Source Sans 3", sans-serif; }
    .stage { position: relative; width: 1280px; height: 640px; overflow: hidden;
      background:
        radial-gradient(520px 420px at 930px 330px, #e5b65059, transparent 70%),
        radial-gradient(680px 540px at 140px 30px, #9258e599, transparent 72%),
        radial-gradient(520px 360px at 1180px 640px, #74dcc833, transparent 70%),
        linear-gradient(160deg, #241f33, var(--night) 60%); }
    /* A faint pixel grid recalls the board and the pixel mark without competing with the cards. */
    .stage::before { content: ""; position: absolute; inset: 0; opacity: .35;
      background-image: radial-gradient(#ffffff26 1.2px, transparent 1.6px); background-size: 32px 32px; }
    .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 22px; }
    .logo { width: 104px; height: 104px; image-rendering: pixelated; filter: drop-shadow(0 6px 18px #9258e5aa); }
    h1 { margin: 0; font-size: 132px; font-weight: 750; line-height: .9; letter-spacing: -.035em; }
    .slogan { margin: 26px 0 0; font-size: 58px; font-weight: 750; line-height: 1; letter-spacing: -.015em;
      background: linear-gradient(180deg, #fff2c8, var(--gold) 55%, #d8a944); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 12px #e5b65055); }
    .tagline { margin: 22px 0 28px; color: var(--muted); font-size: 31px; font-weight: 550; line-height: 1.2; }
    .tagline b { color: var(--ink); font-weight: 700; }
    code { align-self: flex-start; padding: 9px 22px; border: 2px solid var(--mint-edge); border-radius: 10px; background: var(--mint-ground);
      color: var(--mint); font: 500 32px/1.2 "Geist Mono", monospace; box-shadow: 0 0 28px #74dcc833; }
    code::before { content: "$ "; color: #74dcc8aa; }
    .cards { position: absolute; left: 670px; top: 70px; width: 600px; height: 540px; }
    .card { position: absolute; left: 185px; top: 150px; width: 230px; height: 294px; overflow: hidden; border-radius: 12px;
      transform-origin: 50% 165%; box-shadow: 0 18px 40px #07060ccc, 0 0 0 1px #ffffff1a; }
    .card img { position: absolute; top: -16px; left: calc(-16px - 262px * var(--i)); width: 1310px; height: 326px; }
    .card.hero { box-shadow: 0 18px 40px #07060ccc, 0 0 0 2px #f5c24c, 0 0 46px #e5b650aa; }
    .c0 { transform: rotate(-30deg) translateY(14px); z-index: 1; }
    .c1 { transform: rotate(-15deg) translateY(-4px); z-index: 2; }
    .c2 { transform: translateY(-34px) scale(1.08); z-index: 5; }
    .c3 { transform: rotate(15deg) translateY(-4px); z-index: 3; }
    .c4 { transform: rotate(30deg) translateY(14px); z-index: 4; }
    /* Pixel sparkles in the mark's pip shape. */
    .spark { position: absolute; width: 24px; height: 24px; background: var(--c); image-rendering: pixelated;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 8px var(--c)); }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <div class="brand">
        <img class="logo" src="../assets/logo/deckmate-256.png" alt="Deckmate logo">
        <h1>Deckmate</h1>
      </div>
      <p class="slogan">You hold all the cards.</p>
      <p class="tagline">A local <b>Markdown</b> project board<br>for <b>people</b> and <b>AI agents</b>.</p>
      <code>npx deckmate</code>
    </section>
    <div class="cards" aria-label="Five real cards from the sample project, fanned like a hand">
      <div class="card c0" style="--i: 2"><img src="social-cards.png" alt=""></div>
      <div class="card c1 hero" style="--i: 1"><img src="social-cards.png" alt=""></div>
      <div class="card c2 hero" style="--i: 0"><img src="social-cards.png" alt="Moonwake Lantern, a golden Hero card"></div>
      <div class="card c3" style="--i: 3"><img src="social-cards.png" alt=""></div>
      <div class="card c4" style="--i: 4"><img src="social-cards.png" alt="A task owned by an AI agent"></div>
    </div>
    <i class="spark" style="--c: #f5c24c; left: 1206px; top: 64px"></i>
    <i class="spark" style="--c: #a8eedf; left: 690px; top: 92px; width: 16px; height: 16px"></i>
    <i class="spark" style="--c: #b08af3; left: 616px; top: 560px; width: 18px; height: 18px"></i>
  </main>
</body>
</html>
